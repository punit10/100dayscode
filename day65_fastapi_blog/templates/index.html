<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        {% if title %}
        FastAPI blog - {{ title }}
        {% else %}
        FastAPI blog
        {% endif %}
    </title>
</head>
<body>
    <h1>Welcome to homepage</h1>
    {% for post in posts %}
    <h2>{{ post.title }}</h2>
    <p>{{ post.content }}</p>
    {% endfor %}
</body>
</html>
