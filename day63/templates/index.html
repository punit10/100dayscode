<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Fit Mind Readers</title>
  </head>
  <body>
    <h1>Fit Mind Readers</h1>
    {% if not all_books %}
        <p>No Books available.</p>
    {% else %}
        {% for book in all_books %}
        <ul>
          <li>{{ book.title }} - {{ book.author }} - {{ book.rating}}/10 </li>
        </ul>
        {% endfor %}
    {% endif %}
    <a href="{{ url_for('add') }}">Add New Book</a>
  </body>
</html>
