{% extends 'base.html' %}
{% block title %}Restaurants{% endblock %}

{% block content %}

<div class="container">
  <div class="row">
    <div class="col-sm-12">

      <h1>All Cafes</h1>
	  <table class="table table-dark table-striped table-hover">
          <!-- This is where you will write the code to render a Bootstrap 
          Table that contains all the information from the 
          cafe-data.csv file. -->
           {% for cafe in cafes %}
          <thead>
          </thead>
          <tbody>
            <tr>
              <th scope="col">{{ cafe[0] }}</th>
              <td><a class="btn btn-warning" href="{{ cafe[1] }}">Maps Link</a></td>
              <td>{{ cafe[2] }}</td>
              <td>{{ cafe[3] }}</td>
              <td>{{ cafe[4] }}</td>
              <td>{{ cafe[5] }}</td>
            </tr>
          </tbody>
      {% endfor %}

  	  </table>
      <p><a class="btn btn-primary btn-lg" href="{{ url_for('home') }}">Home page</a></p>
      <a class="btn btn-success" href="{{ url_for('add_cafe') }}" role="button">Add New!</a>
    </div>
  </div>
</div>

{% endblock %}
